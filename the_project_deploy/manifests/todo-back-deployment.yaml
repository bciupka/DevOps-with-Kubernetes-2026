apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project-todo-back-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project-todo-back
  template:
    metadata:
      labels:
        app: the-project-todo-back
    spec:
      containers:
        - image: the-project-todo-back:1.00
          name: the-project-todo-back
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: the-project-configmap
                  key: TODO_BACKEND_PORT
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: the-project-configmap
                  key: TODO_POSTGRES_URL
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: the-project-configmap
                  key: TODO_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: the-project-secret
                  key: TODO_POSTGRES_PASSWORD

